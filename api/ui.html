<!doctype html>
<meta charset="utf-8">
<title>Comparables · conduit CMBS</title>
<!--
  The screen. One file, no dependencies, served by the same process.

  THE FOUR THINGS THIS SCREEN DOES AND A SPREADSHEET DOES NOT

  1. It says how many loans each number is based on. A median of 31 and a median
     of 6 look the same in a spreadsheet and do not mean the same thing.
  2. It refuses. Below the minimum it shows what would have to be loosened instead
     of drawing a range from three loans.
  3. Every comparable carries the link to its SEC document. A number you cannot
     open has to be taken on trust; with the filing behind it, it is verifiable.
  4. It says WHERE the comparables came from. If the radius had to open from the
     state to the region, that changes what the number means and it goes at the
     top, not in a footnote.

  THE SCENARIOS APPEAR WHEN THEY HELP AND LEAVE WHEN THEY DO NOT

  A blank form asks the user to already know what to ask, so on an empty screen the
  examples are the most useful thing there can be. But once there is a result,
  those same buttons are noise competing with the answer.

  They are shown only in the empty state and hidden on the first search, with a
  discreet link to bring them back. That is the difference between a help and a
  billboard.

  And the run of all twelve at once lives at /scenarios, which is a different
  screen for a different audience: that one is for us, to see at a glance what the
  corpus can and cannot answer. A broker does not need to see all twelve.

  THE FIELD NAMES HERE ARE A CONTRACT WITH api/comps.ts AND NOTHING CHECKS IT

  This file reads `sufficient`, `found`, `ladder`, `scope`, `target`, `sample` and
  `provenanceStamp` straight off the JSON. There is no compiler between the two.
  Renaming a field in comps.ts and forgetting it here produces a page that renders
  "undefined" without any error — which is exactly what happened to the footer when
  `estampa` became `provenanceStamp` during the migration to English, and it went
  unnoticed for several commits.
-->
<style>
  :root { --fg:#1a1a1a; --muted:#6b6b6b; --line:#e4e4e4; --bg:#fff;
          --dot:#2b5fa8; --warn:#8a6410; --warnbg:#fdf6ec; }
  * { box-sizing:border-box }
  body { margin:0; padding:40px 24px 64px; background:var(--bg); color:var(--fg);
         font:15px/1.55 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif }
  main { max-width:860px; margin:0 auto }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:-.01em }
  .sub { color:var(--muted); font-size:13.5px; margin:0 0 28px }
  form { display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; align-items:end;
         padding:18px; border:1px solid var(--line); border-radius:8px; background:#fafafa }
  label { display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;
          color:var(--muted); font-weight:600; margin-bottom:5px }
  input, select { width:100%; padding:8px 10px; border:1px solid #d4d4d4; border-radius:5px;
                  font:inherit; font-size:14px; background:#fff }
  button { padding:9px 18px; border:0; border-radius:5px; background:var(--dot); color:#fff;
           font:inherit; font-weight:600; cursor:pointer }
  button:disabled { background:#9aa8bd; cursor:default }
  section { margin-top:32px }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
       margin:0 0 12px; font-weight:600 }
  table { width:100%; border-collapse:collapse }
  th, td { padding:10px; text-align:right; border-top:1px solid var(--line);
           font-variant-numeric:tabular-nums }
  th:first-child, td:first-child { text-align:left }
  thead th { border-top:0; border-bottom:1px solid var(--line); font-size:11.5px;
             text-transform:uppercase; letter-spacing:.05em; color:var(--muted) }
  .big { font-size:17px; font-weight:600 }
  .muted { color:var(--muted) }
  .sm { font-size:12.5px }
  .verdict { font-size:16px; padding:14px 16px; border-radius:6px; margin-bottom:20px;
             background:#f4f6fa; border:1px solid #e2e8f2 }
  .notice { background:var(--warnbg); border:1px solid #f0e2bc; color:#5c4409;
            padding:16px 18px; border-radius:6px }
  .notice h2 { color:var(--warn) }
  .notice li { margin:4px 0 }
  a { color:var(--dot) }
  footer { margin-top:40px; padding-top:18px; border-top:1px solid var(--line);
           font-size:12.5px; color:var(--muted) }
  .channel { background:#fafafa; border-left:3px solid var(--line); padding:10px 14px;
             font-size:13px; color:var(--muted); margin-top:18px }
  .scenarios { margin:0 0 14px }
  .scenarios b { display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;
                 color:var(--muted); margin-bottom:8px; font-weight:600 }
  .chip { display:inline-block; margin:0 6px 6px 0; padding:6px 11px; border-radius:20px;
          border:1px solid #d8d8d8; background:#fff; font:inherit; font-size:13px;
          cursor:pointer; color:var(--fg) }
  .chip:hover { border-color:var(--dot); color:var(--dot) }
  .chip.empty { border-style:dashed; color:var(--muted) }
  .scenarios.hidden { display:none }
  .reopen { background:none; border:0; padding:0; font:inherit; font-size:13px;
            color:var(--muted); cursor:pointer; text-decoration:underline;
            margin:14px 0 0; display:none }
  .reopen.visible { display:inline }
  .nav { float:right; font-size:13px }
  .scope { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px;
           font-weight:600; text-transform:uppercase; letter-spacing:.04em;
           background:#eef2f8; color:var(--dot); margin-left:8px; vertical-align:middle }
  .scope.widened { background:var(--warnbg); color:var(--warn) }
  .ladder { font-size:12.5px; color:var(--muted); margin:8px 0 0 }
  .ladder i { font-style:normal; color:var(--fg) }
  @media (max-width:720px) { form { grid-template-columns:1fr 1fr } }
</style>
<main>
  <a class="nav" href="/scenarios">see all twelve scenarios at once →</a>
  <h1>What terms did similar loans get?</h1>
  <p class="sub">Comparables from conduit CMBS loans, taken from public SEC EDGAR documents.</p>

  <div class="scenarios" id="scenarios">
    <b>Situations to try</b>
    <div id="chips"></div>
  </div>

  <form id="f">
    <div>
      <label for="state">State</label>
      <input id="state" value="GA" maxlength="2" style="text-transform:uppercase">
    </div>
    <div>
      <label for="type">Type</label>
      <select id="type"></select>
    </div>
    <div>
      <label for="amount">Amount (US$)</label>
      <input id="amount" value="28000000" inputmode="numeric">
    </div>
    <div>
      <label for="ltv">LTV sought</label>
      <input id="ltv" value="70" placeholder="optional">
    </div>
    <div><button id="go">Search</button></div>
  </form>

  <button type="button" class="reopen" id="reopen">see other situations</button>
  <div id="out"></div>

  <footer id="foot"></footer>
</main>

<script>
const $ = (s) => document.querySelector(s);
const fmtPct = (v) => (v * 100).toFixed(1) + "%";
const fmtX = (v) => v.toFixed(2) + "x";
const fmtUSD = (v) => "US$" + Math.round(v).toLocaleString("en-US");

/** Each metric knows how it reads: an LTV of 0.61 and a DSCR of 1.44 are not alike. */
const FORMAT = { ltv: fmtPct, debt_yield: fmtPct, interest_rate: fmtPct, dscr: fmtX };

/**
 * The same twelve scenarios that `npm run api:scenarios` runs.
 *
 * The two marked `empty` expect to find NO comparables, and that is a useful
 * answer: "this is not a conduit deal". They are shown with a dashed border so it
 * is clear they are there on purpose.
 */
const SCENARIOS = [
  { t: "Multifamily refi GA 28M", state: "GA", type: "Multifamily", amount: 28e6, ltv: 70 },
  { t: "Multifamily TX 15M", state: "TX", type: "Multifamily", amount: 15e6 },
  { t: "Office NY 45M", state: "NY", type: "Office", amount: 45e6, ltv: 60 },
  { t: "Industrial CA 30M", state: "CA", type: "Industrial", amount: 30e6 },
  { t: "Hospitality FL 22M", state: "FL", type: "Hospitality", amount: 22e6 },
  { t: "Retail FL 12M", state: "FL", type: "Retail", amount: 12e6 },
  { t: "Industrial NJ 25M", state: "NJ", type: "Industrial", amount: 25e6, ltv: 65 },
  { t: "Multifamily NY 60M", state: "NY", type: "Multifamily", amount: 60e6, ltv: 75 },
  { t: "Self storage AZ 8M", state: "AZ", type: "Self Storage", amount: 8e6 },
  { t: "Mixed use IL 20M", state: "IL", type: "Mixed Use", amount: 20e6 },
  { t: "Retail OH 4M", state: "OH", type: "Retail", amount: 4e6, empty: true },
  { t: "Manufactured WY 6M", state: "WY", type: "Manufactured", amount: 6e6, empty: true },
];

function paintScenarios() {
  $("#chips").innerHTML = SCENARIOS.map(
    (c, i) => `<button type="button" class="chip${c.empty ? " empty" : ""}" data-i="${i}"
                 title="${c.empty ? "We expect NO comparables: that is the answer" : ""}">${c.t}</button>`,
  ).join("");
  $("#chips").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]");
    if (!b) return;
    const c = SCENARIOS[+b.dataset.i];
    $("#state").value = c.state;
    $("#type").value = c.type;
    $("#amount").value = String(c.amount);
    $("#ltv").value = c.ltv ?? "";
    $("#f").requestSubmit();
  });
}

async function loadTypes() {
  const r = await fetch("/corpus").then((x) => x.json());
  $("#type").innerHTML = r.data.types
    .map((t) => `<option${t === "Multifamily" ? " selected" : ""}>${t}</option>`)
    .join("");
  $("#foot").textContent = r.data.provenanceStamp;
}

function render(d) {
  if (!d.sufficient) {
    /**
     * The refusal is not an empty screen: it says how many there are, how many are
     * needed and what would happen on loosening each criterion, so the asker
     * decides.
     */
    return `<div class="notice">
      <h2>Not enough to give a range</h2>
      <p>At least <b>${d.minimum}</b> comparables are needed and there are not that many
      even opening the radius to the whole country. With fewer, a median would say more
      than this data knows.</p>
      <p>What was tried:</p>
      <ul>${d.ladder
        .map((p) => `<li>${p.label} → <b>${p.found}</b></li>`)
        .join("")}</ul>
      <p>And if you also loosen the size or the window:</p>
      <ul>${d.ifWidened
        .map((s) => `<li>${s.criterion} → <b>${s.found}</b></li>`)
        .join("")}</ul>
      <p class="sm">For a loan like this, this channel is probably not the route:
      a regional bank or an agency is the alternative.</p>
    </div>`;
  }

  const target = d.target
    ? `<div class="verdict">Of the <b>${d.target.of}</b> comparables that publish an LTV,
       <b>${d.target.reached}</b> reached ${fmtPct(d.target.ltv)} or higher.
       ${
         d.target.reached / Math.max(1, d.target.of) < 0.25
           ? "<b>That is a small slice of the channel:</b> the expectation is worth revisiting before going out to market."
           : "It is within what this channel has been delivering."
       }</div>`
    : "";

  return `${target}
    <section>
      <h2>${d.found} comparables<span class="scope${
        d.scope === "state" ? "" : " widened"
      }">${d.scope === "state" ? d.scopeLabel : `${d.scopeLabel} — radius widened`}</span></h2>
      ${
        d.scope === "state"
          ? ""
          : `<p class="ladder">${d.ladder[0].label} alone was not enough (<i>${
              d.ladder[0].found
            }</i> comparables), so the radius was opened. ${d.ladder
              .map((p) => `${p.label}: <i>${p.found}</i>`)
              .join(" · ")}</p>`
      }
      <table>
        <thead><tr><th></th><th>p25</th><th>median</th><th>p75</th><th>over</th></tr></thead>
        <tbody>${d.distributions
          .map((m) => {
            const f = FORMAT[m.metric] ?? ((v) => v.toFixed(2));
            return `<tr>
              <td>${m.label}</td>
              <td class="muted">${f(m.p25)}</td>
              <td class="big">${f(m.p50)}</td>
              <td class="muted">${f(m.p75)}</td>
              <td class="muted sm">${m.base} loans</td>
            </tr>`;
          })
          .join("")}</tbody>
      </table>
      <p class="muted sm" style="margin-top:10px">The "over" column is not the same for
      all of them: not every loan publishes every metric, and each row was computed only
      with the ones that do.</p>
    </section>

    <section>
      <h2>The comparables</h2>
      <table>
        <thead><tr><th>property</th><th>city</th><th>amount</th><th>date</th><th>source</th></tr></thead>
        <tbody>${d.sample
          .map(
            (c) => `<tr>
              <td>${c.property ?? "<span class=muted>no name</span>"}</td>
              <td class="muted sm">${c.city ?? "—"}</td>
              <td>${fmtUSD(c.amount)}</td>
              <td class="muted sm">${c.date}</td>
              <td class="sm"><a target="_blank" rel="noopener" href="${c.document}"
                 title="Annex A of ${c.issuance}">${c.issuance.slice(0, 26)}</a>
                 <a class="muted" target="_blank" rel="noopener" href="${c.index}"
                    title="All documents of this issuance on EDGAR">↗</a></td>
            </tr>`,
          )
          .join("")}</tbody>
      </table>
    </section>

    <div class="channel">${d.corpus.channel}</div>`;
}

$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#go").disabled = true;
  $("#out").innerHTML = `<p class="muted" style="margin-top:32px">Searching…</p>`;
  const q = new URLSearchParams({
    state: $("#state").value.trim(),
    type: $("#type").value,
    amount: $("#amount").value.replace(/[^0-9.]/g, ""),
  });
  if ($("#ltv").value.trim()) q.set("target_ltv", $("#ltv").value.trim());
  try {
    const r = await fetch("/comps?" + q).then((x) => x.json());
    if (r.data.error) {
      $("#out").innerHTML = `<div class="notice"><h2>Parameters</h2><ul>${r.data.error.failures
        .map((f) => `<li>${f.message}${f.expected ? ` — example: <code>${f.expected}</code>` : ""}</li>`)
        .join("")}</ul></div>`;
    } else {
      $("#out").innerHTML = render(r.data);
      $("#foot").textContent = r.data.corpus.provenanceStamp;
      /**
       * With a result on screen the examples stop helping and start competing with
       * the answer. They are hidden, and the link remains for anyone who wants to
       * look at them again.
       */
      $("#scenarios").classList.add("hidden");
      $("#reopen").classList.add("visible");
    }
  } catch (err) {
    $("#out").innerHTML = `<div class="notice"><h2>Could not query</h2><p>${err}</p></div>`;
  }
  $("#go").disabled = false;
});

$("#reopen").addEventListener("click", () => {
  $("#scenarios").classList.remove("hidden");
  $("#reopen").classList.remove("visible");
});

paintScenarios();
loadTypes();
</script>
