# Local Postgres for the corpus.
#
#   docker compose up -d
#   npm run db:migrate
#
# The port is 5433, not 5432, so it does not clash with a Postgres you may
# already have installed on the machine.

services:
  postgres:
    image: postgres:17-alpine
    container_name: financials-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: financials
      POSTGRES_PASSWORD: financials
      POSTGRES_DB: financials
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financials -d financials"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
